<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>webgd fixture: WebGPU</title>
<style>html, body { margin: 0; background: #222; }</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<script src="common.js"></script>
<script type="module">
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) throw new Error('WebGPU unavailable');
const device = await adapter.requestDevice();
const canvas = document.getElementById('c');
const context = canvas.getContext('webgpu');
const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format: canvasFormat, alphaMode: 'opaque' });

// Vertex/index buffers created mappedAtCreation before the loop.
const cube = webgdFixture.cube();
const vbuf = device.createBuffer({ label: 'cube vertices', size: cube.vertices.byteLength, usage: GPUBufferUsage.VERTEX, mappedAtCreation: true });
new Float32Array(vbuf.getMappedRange()).set(cube.vertices);
vbuf.unmap();
const ibuf = device.createBuffer({ label: 'cube indices', size: cube.indices.byteLength, usage: GPUBufferUsage.INDEX, mappedAtCreation: true });
new Uint16Array(ibuf.getMappedRange()).set(cube.indices);
ibuf.unmap();

// Globals { mvp: mat4x4f, tint: vec4f } = 80 bytes; tint.w carries t for the compute pass.
const ubo = device.createBuffer({ label: 'globals', size: 80, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const storage = device.createBuffer({ label: 'sin storage', size: 1024 * 4, usage: GPUBufferUsage.STORAGE });

const checker = device.createTexture({ label: 'checker', size: [64, 64], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
device.queue.writeTexture({ texture: checker }, webgdFixture.checker(64), { bytesPerRow: 64 * 4 }, [64, 64]);
const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'repeat', addressModeV: 'repeat' });

const offscreen = device.createTexture({ label: 'offscreen', size: [256, 256], format: 'rgba16float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
const depth = device.createTexture({ label: 'depth', size: [256, 256], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
const offscreenView = offscreen.createView();
const depthView = depth.createView();

const cubeModule = device.createShaderModule({ label: 'cube', code: /* wgsl */ `
struct Globals { mvp: mat4x4f, tint: vec4f };
@group(0) @binding(0) var<uniform> g: Globals;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
struct VsOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@location(0) pos: vec3f, @location(1) uv: vec2f) -> VsOut {
  var o: VsOut;
  o.pos = g.mvp * vec4f(pos, 1.0);
  o.uv = uv;
  return o;
}
@fragment fn fs(i: VsOut) -> @location(0) vec4f {
  return textureSample(tex, samp, i.uv) * vec4f(g.tint.xyz, 1.0);
}
` });
const cubeBGL = device.createBindGroupLayout({ label: 'cube bgl', entries: [
  { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
  { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
  { binding: 2, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
] });
const cubePipeline = device.createRenderPipeline({
  label: 'cube pipeline',
  layout: device.createPipelineLayout({ bindGroupLayouts: [cubeBGL] }),
  vertex: { module: cubeModule, entryPoint: 'vs', buffers: [{ arrayStride: 20, attributes: [
    { shaderLocation: 0, offset: 0, format: 'float32x3' },
    { shaderLocation: 1, offset: 12, format: 'float32x2' },
  ] }] },
  fragment: { module: cubeModule, entryPoint: 'fs', targets: [{ format: 'rgba16float' }] },
  primitive: { topology: 'triangle-list' },
  depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
});
const cubeBG = device.createBindGroup({ label: 'cube bg', layout: cubeBGL, entries: [
  { binding: 0, resource: { buffer: ubo } },
  { binding: 1, resource: checker.createView() },
  { binding: 2, resource: sampler },
] });

const computeModule = device.createShaderModule({ label: 'sin', code: /* wgsl */ `
struct Globals { mvp: mat4x4f, tint: vec4f };
@group(0) @binding(0) var<uniform> g: Globals;
@group(0) @binding(1) var<storage, read_write> outv: array<f32, 1024>;
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) id: vec3u) {
  let i = id.x;
  outv[i] = sin(f32(i) * g.tint.w);
}
` });
const computePipeline = device.createComputePipeline({ label: 'sin pipeline', layout: 'auto', compute: { module: computeModule, entryPoint: 'main' } });
const computeBG = device.createBindGroup({ label: 'sin bg', layout: computePipeline.getBindGroupLayout(0), entries: [
  { binding: 0, resource: { buffer: ubo } },
  { binding: 1, resource: { buffer: storage } },
] });

const compModule = device.createShaderModule({ label: 'composite', code: /* wgsl */ `
@group(0) @binding(0) var scene: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
struct VsOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VsOut {
  let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u));
  var o: VsOut;
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
@fragment fn fs(i: VsOut) -> @location(0) vec4f {
  return vec4f(textureSample(scene, samp, i.uv).rgb, 1.0);
}
` });
const compPipeline = device.createRenderPipeline({
  label: 'composite pipeline', layout: 'auto',
  vertex: { module: compModule, entryPoint: 'vs' },
  fragment: { module: compModule, entryPoint: 'fs', targets: [{ format: canvasFormat }] },
  primitive: { topology: 'triangle-list' },
});
const compBG = device.createBindGroup({ label: 'composite bg', layout: compPipeline.getBindGroupLayout(0), entries: [
  { binding: 0, resource: offscreenView },
  { binding: 1, resource: sampler },
] });
// Composite fullscreen triangle recorded once, before the loop, and replayed via executeBundles.
const compBundleEncoder = device.createRenderBundleEncoder({ label: 'composite bundle encoder', colorFormats: [canvasFormat] });
compBundleEncoder.setPipeline(compPipeline);
compBundleEncoder.setBindGroup(0, compBG);
compBundleEncoder.draw(3);
const compBundle = compBundleEncoder.finish({ label: 'composite bundle' });

const start = performance.now();
function frame(now) {
  const t = (now - start) / 1000;
  // Per-frame mappedAtCreation staging buffer copied into the uniform buffer (exercises mappedWrite).
  const staging = device.createBuffer({ label: 'globals staging', size: 80, usage: GPUBufferUsage.COPY_SRC, mappedAtCreation: true });
  const g = new Float32Array(staging.getMappedRange());
  g.set(webgdFixture.mvp(t, 1, true), 0);
  g.set([1, 0.85, 0.7, t], 16);
  staging.unmap();

  const enc = device.createCommandEncoder({ label: 'frame' });
  enc.copyBufferToBuffer(staging, 0, ubo, 0, 80);

  enc.pushDebugGroup('Offscreen');
  const pass = enc.beginRenderPass({
    colorAttachments: [{ view: offscreenView, clearValue: { r: 0.1, g: 0.1, b: 0.15, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
    depthStencilAttachment: { view: depthView, depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
  });
  pass.setPipeline(cubePipeline);
  pass.setBindGroup(0, cubeBG);
  pass.setVertexBuffer(0, vbuf);
  pass.setIndexBuffer(ibuf, 'uint16');
  pass.insertDebugMarker('cube');
  pass.drawIndexed(36);
  pass.end();
  enc.popDebugGroup();

  enc.pushDebugGroup('Compute');
  const cpass = enc.beginComputePass();
  cpass.setPipeline(computePipeline);
  cpass.setBindGroup(0, computeBG);
  cpass.dispatchWorkgroups(4);
  cpass.end();
  enc.popDebugGroup();

  enc.pushDebugGroup('Composite');
  const cview = context.getCurrentTexture().createView();
  const comp = enc.beginRenderPass({
    colorAttachments: [{ view: cview, clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
  });
  comp.executeBundles([compBundle]);
  comp.end();
  enc.popDebugGroup();

  device.queue.submit([enc.finish()]);
  staging.destroy();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
